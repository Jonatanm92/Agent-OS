<title>Min vardag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════
   Min vardag — formgivning
   Allt som styr utseendet ligger som variabler här uppe.
   Ändra en rad, och den ändringen slår igenom i hela appen.
   ═══════════════════════════════════════════════════════════ */
:root{
  /* Ljust läge: svalt papper, bläck med blå ton, petrol som struktur,
     och EN varm signalfärg som bara nästa handling får använda. */
  --paper:#edeff0;
  --surface:#ffffff;
  --sunk:#e3e7e8;
  --line:#d5dadc;
  --line-soft:#e6eaeb;

  --ink:#14181b;
  --muted:#5c666c;
  --faint:#8d979c;

  --deep:#0e4a52;          /* petrol — struktur, rubriker, fasta åtaganden */
  --deep-soft:#dce9ea;
  --deep-ink:#0a363c;

  --signal:#c8552a;        /* varm signal — ENDAST nästa handling */
  --signal-soft:#fbe7dd;
  --signal-ink:#8f3a1a;

  --sage:#4e7a63;          /* egen tid, återhämtning */
  --sage-soft:#e0ebe4;
  --sage-ink:#2f5344;

  --warn:#8a5a1f;
  --warn-soft:#f8ecd9;
  --danger:#a13a29;
  --danger-soft:#f7e2de;

  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --tap:48px;
  --gutter:16px;
  --time-col:52px;

  --shadow-1:0 1px 2px rgba(20,24,27,.06);
  --shadow-2:0 2px 4px rgba(20,24,27,.05),0 10px 26px rgba(20,24,27,.07);
  --shadow-3:0 4px 10px rgba(20,24,27,.08),0 20px 50px rgba(20,24,27,.12);

  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1113; --surface:#171b1e; --sunk:#1f2429; --line:#2c3338; --line-soft:#232a2e;
    --ink:#e8ecee; --muted:#9aa4aa; --faint:#6d777d;
    --deep:#5fb5be; --deep-soft:#13343a; --deep-ink:#8fd2d9;
    --signal:#f08a5d; --signal-soft:#3a2118; --signal-ink:#f8b492;
    --sage:#7fb795; --sage-soft:#1a2f26; --sage-ink:#a5d4b6;
    --warn:#dfae6e; --warn-soft:#332a1b;
    --danger:#e08a78; --danger-soft:#38211d;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.35);
    --shadow-3:0 4px 10px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0e1113; --surface:#171b1e; --sunk:#1f2429; --line:#2c3338; --line-soft:#232a2e;
  --ink:#e8ecee; --muted:#9aa4aa; --faint:#6d777d;
  --deep:#5fb5be; --deep-soft:#13343a; --deep-ink:#8fd2d9;
  --signal:#f08a5d; --signal-soft:#3a2118; --signal-ink:#f8b492;
  --sage:#7fb795; --sage-soft:#1a2f26; --sage-ink:#a5d4b6;
  --warn:#dfae6e; --warn-soft:#332a1b;
  --danger:#e08a78; --danger-soft:#38211d;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.35);
  --shadow-3:0 4px 10px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
#app{max-width:600px;margin:0 auto;padding-block:0 128px;padding-inline:var(--gutter)}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.018em;line-height:1.18;text-wrap:balance}
h1{font-size:clamp(26px,7.4vw,32px);font-weight:700}
h2{font-size:19px}
h3{font-size:16.5px}
p{margin:0}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font-family:inherit;font-size:16.5px;color:inherit}
:focus-visible{outline:2.5px solid var(--signal);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── topp ───────────────────────────────────────────── */
.top{padding:20px 0 12px;display:flex;align-items:flex-start;gap:12px}
.top .grow{flex:1;min-width:0}
.eyebrow{
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.eyebrow .now{color:var(--signal);font-weight:500}

/* ── dagsband: var i dygnet du är ───────────────────── */
.ribbon{margin:14px 0 20px}
.ribbon-track{
  position:relative;height:38px;border-radius:var(--r-sm);background:var(--sunk);overflow:hidden
}
.ribbon-block{
  position:absolute;top:0;bottom:0;background:var(--deep-soft);
  border-left:2px solid var(--deep);display:flex;align-items:center;overflow:hidden
}
.ribbon-block.egen{background:var(--sage-soft);border-left-color:var(--sage)}
.ribbon-block span{
  font-size:10.5px;padding:0 5px;color:var(--deep-ink);white-space:nowrap;
  font-weight:500;letter-spacing:.01em
}
.ribbon-block.egen span{color:var(--sage-ink)}
.ribbon-past{position:absolute;top:0;bottom:0;left:0;background:var(--ink);opacity:.055;pointer-events:none}
.ribbon-now{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--signal);border-radius:2px;z-index:2}
.ribbon-now::before{
  content:"";position:absolute;top:0;left:50%;translate:-50% 0;
  width:8px;height:8px;border-radius:50%;background:var(--signal)
}
.ribbon-scale{
  display:flex;justify-content:space-between;margin-top:5px;
  font-family:var(--mono);font-size:10.5px;color:var(--faint)
}

/* ── chips ──────────────────────────────────────────── */
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;color:var(--muted);font-weight:450;white-space:nowrap
}
.chip.on{background:var(--deep-soft);border-color:transparent;color:var(--deep-ink);font-weight:550}
.chip.ask{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ── nästa handling: den enda platsen signalfärgen bor ─ */
.next{
  background:var(--signal-soft);border-radius:var(--r-xl);padding:22px 20px;
  margin-bottom:18px;box-shadow:var(--shadow-2);position:relative;overflow:hidden
}
.next::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--signal)}
.next .kicker{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--signal-ink);font-weight:500
}
.next h2{margin:9px 0 7px;font-size:clamp(21px,5.6vw,25px);color:var(--signal-ink)}
.next .detail{color:var(--signal-ink);opacity:.82;font-size:15px}
.next .btnrow{margin-top:17px}
.next.calm{background:var(--sage-soft);box-shadow:var(--shadow-1)}
.next.calm::before{background:var(--sage)}
.next.calm .kicker,.next.calm h2,.next.calm .detail{color:var(--sage-ink)}

/* ── knappar ────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);font-weight:500;
  transition:transform .09s ease,background .15s ease
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--surface);font-weight:550}
:root[data-theme="dark"] .btn.primary{color:#08191c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08191c}}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:550}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:0 13px;font-size:14.5px}
.btn.tiny{min-height:38px;padding:0 11px;font-size:13.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 auto;min-width:fit-content}

/* ── sektioner och rader ────────────────────────────── */
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.section-head .hint{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.03em}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.panel.plain{background:transparent;box-shadow:none}
.panel.sunk{background:var(--sunk);box-shadow:none}

.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line-soft)}
.row:first-child{border-top:none}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:500;line-height:1.32}
.row .sub{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35}
.row .at{
  font-family:var(--mono);font-size:14px;color:var(--muted);flex:none;
  width:var(--time-col);font-variant-numeric:tabular-nums
}
.row.fixed .at{color:var(--deep);font-weight:500}
.strike{text-decoration:line-through;color:var(--faint)}

/* Tryckytan är hela knappen (44px). Cirkeln som syns är mindre — men det
   är knappen, inte cirkeln, som fingret måste träffa. */
.tick{
  width:44px;height:44px;flex:none;border:none;background:none;padding:0;
  display:grid;place-items:center;position:relative;margin-inline:-9px
}
.tick::before{
  content:"";width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line);box-sizing:border-box
}
.tick.done::before{background:var(--deep);border-color:var(--deep)}
.tick.done::after{
  content:"✓";position:absolute;color:var(--surface);
  font-size:14px;font-weight:700;line-height:1
}
:root[data-theme="dark"] .tick.done::after{color:#08191c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tick.done::after{color:#08191c}}

/* ── etiketter ──────────────────────────────────────── */
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;
  font-size:12px;font-weight:550;letter-spacing:.01em;background:var(--sunk);color:var(--muted)
}
.tag.behover{background:var(--warn-soft);color:var(--warn)}
.tag.planerat{background:var(--deep-soft);color:var(--deep-ink)}
.tag.bekraftat{background:var(--sage-soft);color:var(--sage-ink)}
.tag.prel{background:transparent;border:1px dashed var(--line);color:var(--faint);font-weight:450}

/* ── frågor i stället för antaganden ────────────────── */
.ask-card{
  background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;
  border-left:3px solid var(--warn);box-shadow:var(--shadow-1)
}
.ask-card .q{font-size:15px;margin-bottom:10px}
.ask-card .btnrow .btn{flex:0 1 auto}

/* ── berätta ────────────────────────────────────────── */
.tell{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1)}
.tell textarea{
  width:100%;min-height:104px;padding:14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--paper);resize:vertical;line-height:1.45
}
.scroller{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{flex:none}

.proposal{
  background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;
  box-shadow:var(--shadow-2);border-top:3px solid var(--deep)
}
.change{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);font-size:15px;line-height:1.4}
.change:first-of-type{border-top:none}
.change .mark{color:var(--deep);font-weight:700;flex:none}
.question{background:var(--sunk);border-radius:var(--r);padding:14px;margin:11px 0}
.question .q{font-weight:550;margin-bottom:10px}
.question .opts{display:flex;flex-direction:column;gap:7px}
.question .opts .btn{width:100%;justify-content:flex-start;text-align:left}
.question .opts .btn.picked{background:var(--deep-soft);border-color:var(--deep);color:var(--deep-ink);font-weight:550}

/* ── vecka ──────────────────────────────────────────── */
.daycard{
  background:var(--surface);border-radius:var(--r);padding:14px 16px;margin-bottom:9px;
  box-shadow:var(--shadow-1);display:flex;gap:14px;align-items:flex-start;width:100%;
  border:none;text-align:left
}
.daycard.today{box-shadow:var(--shadow-2);border-left:3px solid var(--signal)}
.daycard .date{flex:none;width:44px;text-align:center}
.daycard .date .d{display:block;font-family:var(--mono);font-size:21px;font-weight:500;line-height:1}
.daycard .date .w{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.daycard .body .title{display:block}
.daycard .body{flex:1;min-width:0}
.daycard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}

/* ── rutiner ────────────────────────────────────────── */
.routine{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-1);margin-bottom:9px;overflow:hidden}
.routine-head{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:none;background:none;text-align:left}
.routine-head .title{display:block}
.routine-head .grow{min-width:0}
.meter{flex:none;width:34px;height:34px;display:grid;place-items:center;position:relative}
.meter svg{position:absolute;inset:0;transform:rotate(-90deg)}
.meter .val{font-family:var(--mono);font-size:11px;color:var(--muted);z-index:1}

/* ── ark (formulär i stället för systemrutor) ───────── */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{
  background:var(--surface);width:100%;max-width:600px;border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:20px var(--gutter) calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-3);animation:rise .22s ease-out
}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{margin-bottom:4px}
.sheet .lead{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:450}
.field input,.field select,.field textarea{
  width:100%;min-height:var(--tap);padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--paper)
}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:5px;background:var(--sunk);padding:4px;border-radius:var(--r)}
.seg button{flex:1;min-height:40px;border:none;background:none;border-radius:9px;font-size:14.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:var(--shadow-1)}
.daypick{display:flex;gap:5px}
.daypick button{
  flex:1;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--surface);font-size:13px;color:var(--muted);padding:0
}
.daypick button.on{background:var(--deep);border-color:var(--deep);color:var(--surface);font-weight:600}
:root[data-theme="dark"] .daypick button.on{color:#08191c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .daypick button.on{color:#08191c}}

/* ── botten ─────────────────────────────────────────── */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)
}
.nav{max-width:600px;margin:0 auto;display:flex}
.nav button{
  flex:1;min-height:56px;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;padding:6px 2px
}
.nav button .ic{width:21px;height:21px;display:block}
.nav button.on{color:var(--deep);font-weight:600}

/* ── toast ──────────────────────────────────────────── */
.toast{
  position:fixed;left:var(--gutter);right:var(--gutter);bottom:82px;z-index:60;
  max-width:568px;margin:0 auto;background:var(--ink);color:var(--paper);
  border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-3);font-size:14.5px;animation:rise .2s ease-out
}
.toast .grow{flex:1;min-width:0}
.toast button{background:none;border:none;color:inherit;font-weight:650;text-decoration:underline;min-height:40px;padding:0 4px}

/* ── övrigt ─────────────────────────────────────────── */
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .mark{width:44px;height:44px;margin:0 auto 12px;color:var(--faint)}
.note{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:9px}
.muted{color:var(--muted)}
.faint{color:var(--faint);font-size:13.5px;line-height:1.45}
.hr{height:1px;background:var(--line-soft);margin:16px 0;border:none}
.stack{display:flex;flex-direction:column;gap:9px}
</style>

<div id="app" role="main"><div class="empty"><p>Laddar …</p></div></div>
<div class="dock"><nav class="nav" id="nav" aria-label="Huvudmeny"></nav></div>
<div id="toast" aria-live="polite"></div>
<div id="sheet"></div>

<script src="core/model.js"></script>

<script src="core/language.js"></script>
