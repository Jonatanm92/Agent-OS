<title>Min vardag</title>
<style>
:root{
  --bg:#f7f5f1; --surface:#ffffff; --surface-2:#f1eee8; --line:#e2ddd4;
  --text:#221f1b; --muted:#6b645b; --faint:#938b80;
  --accent:#2f6f5e; --accent-soft:#e4efe9; --accent-text:#1d4a3e;
  --warn:#8a5a1f; --warn-soft:#fbf0dd;
  --calm:#3f5f86; --calm-soft:#e7eef7;
  --radius:16px; --radius-lg:22px;
  --shadow:0 1px 2px rgba(34,31,27,.05),0 6px 20px rgba(34,31,27,.06);
  --tap:48px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1e2125; --surface-2:#262a2f; --line:#343a40;
    --text:#ecebe8; --muted:#a8a49d; --faint:#7d7871;
    --accent:#6fbfa3; --accent-soft:#1f3630; --accent-text:#9fd8c2;
    --warn:#e0ac6a; --warn-soft:#332a1c;
    --calm:#8fb2dc; --calm-soft:#1e2937;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --surface-2:#262a2f; --line:#343a40;
  --text:#ecebe8; --muted:#a8a49d; --faint:#7d7871;
  --accent:#6fbfa3; --accent-soft:#1f3630; --accent-text:#9fd8c2;
  --warn:#e0ac6a; --warn-soft:#332a1c;
  --calm:#8fb2dc; --calm-soft:#1e2937;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
#app{max-width:560px;margin:0 auto;padding-block:0 132px;padding-inline:16px}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em;line-height:1.25}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:17px;color:inherit}

/* ---------- topp ---------- */
.top{padding:22px 0 14px;display:flex;align-items:flex-start;gap:12px}
.top .grow{flex:1;min-width:0}
.eyebrow{color:var(--muted);font-size:14px;letter-spacing:.02em}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;color:var(--muted);text-decoration:none
}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-text);font-weight:560}
.chip.warnish{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* ---------- kort ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)
}
.card.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.section-head .hint{color:var(--faint);font-size:13px;margin-left:auto}

/* ---------- gör det här nu ---------- */
.now{
  background:var(--accent-soft);border:none;border-radius:var(--radius-lg);
  padding:20px;margin-bottom:14px;box-shadow:var(--shadow)
}
.now .label{
  font-size:13px;font-weight:640;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-text);opacity:.8
}
.now h2{margin:8px 0 6px;font-size:23px;color:var(--accent-text)}
.now .detail{color:var(--accent-text);opacity:.85;font-size:15px}
.now .actions{margin-top:16px}

/* ---------- knappar ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);font-weight:560;transition:transform .08s ease
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1a16}}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:0 14px;font-size:15px;font-weight:500}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:#a2402f;border-color:#e6c8c1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto;min-width:calc(50% - 4px)}

/* ---------- listrader ---------- */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .grow{flex:1;min-width:0}
.row .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;flex:none;min-width:46px}
.row .title{font-weight:520}
.row .sub{color:var(--muted);font-size:14px;margin-top:2px}
.strike{text-decoration:line-through;color:var(--faint)}
.tick{
  width:var(--tap);height:var(--tap);flex:none;border-radius:50%;border:2px solid var(--line);
  background:transparent;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--accent)
}
.tick.done{background:var(--accent-soft);border-color:transparent}

/* ---------- etiketter ---------- */
.tag{
  display:inline-block;padding:3px 9px;border-radius:8px;font-size:12.5px;font-weight:560;
  background:var(--surface-2);color:var(--muted)
}
.tag.behover{background:var(--warn-soft);color:var(--warn)}
.tag.planerat{background:var(--calm-soft);color:var(--calm)}
.tag.bekraftat{background:var(--accent-soft);color:var(--accent-text)}
.tag.prel{background:transparent;border:1px dashed var(--line);color:var(--faint);font-weight:500}

/* ---------- berätta ---------- */
.tell textarea{
  width:100%;min-height:96px;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);resize:vertical;line-height:1.45
}
.tell textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.suggest::-webkit-scrollbar{display:none}
.suggest .chip{white-space:nowrap;flex:none}

/* ---------- förslag på ändringar ---------- */
.proposal{border:2px solid var(--accent);border-radius:var(--radius);padding:16px;margin-bottom:12px;background:var(--surface)}
.change{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px}
.change:first-of-type{border-top:none}
.change .mark{color:var(--accent);font-weight:700;flex:none}
.question{background:var(--surface-2);border-radius:14px;padding:14px;margin:10px 0}
.question .q{font-weight:600;margin-bottom:10px}
.question .opts{display:flex;flex-direction:column;gap:8px}
.question .opts .btn{width:100%;justify-content:flex-start;text-align:left}
.question .opts .btn.picked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}

/* ---------- botten ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
.nav{max-width:560px;margin:0 auto;display:flex}
.nav button{
  flex:1;min-height:58px;border:none;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;padding:6px 2px
}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--accent);font-weight:640}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:16px;right:16px;bottom:86px;z-index:60;max-width:528px;margin:0 auto;
  background:var(--text);color:var(--bg);border-radius:14px;padding:13px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:15px
}
.toast button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;min-height:40px;padding:0 4px}

/* ---------- övrigt ---------- */
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:30px;margin-bottom:8px}
.note{
  display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14.5px;color:var(--muted)
}
.note .btnrow{margin-top:8px}
.note .btn.small{min-width:0;flex:0 0 auto}
.muted{color:var(--muted)}
.faint{color:var(--faint);font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select{
  width:100%;min-height:var(--tap);padding:0 13px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface)
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:42px;border:none;background:none;border-radius:9px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.hr{height:1px;background:var(--line);margin:18px 0;border:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app" role="main"><div class="empty"><div class="big">·</div><p>Laddar …</p></div></div>
<div class="dock"><nav class="nav" id="nav" aria-label="Huvudmeny"></nav></div>
<div id="toast"></div>

<script src="core/util.js"></script>
<script src="core/model.js"></script>
<script src="core/planner.js"></script>
<script src="core/language.js"></script>
<script src="core/apply.js"></script>
<script src="core/evening.js"></script>
<script src="app/storage.js"></script>
<script src="app/ai.js"></script>
<script src="app/ui.js"></script>
