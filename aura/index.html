<title>Aura</title>
<meta name="description" content="Aura — a calm, adaptive assistant for everyday life.">
<meta name="theme-color" content="#eef1f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════
   Aura — design tokens. Evolved from Min vardag: cool mist paper, ink,
   petrol for structure, sage for rest — and ONE warm ember colour that
   belongs to the NOW card alone. Change a token here; it changes everywhere.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --paper:#eef1f0; --surface:#fbfcfc; --raised:#ffffff; --sunk:#e3e8e7;
  --line:#d2dad9; --line-soft:#e2e8e7;
  --ink:#141a1b; --muted:#56656a; --faint:#869499;
  --deep:#12474d; --deep-soft:#d8e7e7; --deep-ink:#0b3439; --on-deep:#ffffff;
  --signal:#cf5b28; --signal-soft:#fbe4d7; --signal-ink:#833111; --signal-glow:rgba(233,116,58,.34); --on-signal:#ffffff;
  --sage:#4a755f; --sage-soft:#dde9e1; --sage-ink:#2a4d3b;
  --warn:#86561b; --warn-soft:#f6ead4;
  --danger:#a03828; --danger-soft:#f5dfdb;
  --scrim:rgba(8,14,15,.46);
  --shadow-1:0 1px 2px rgba(18,32,34,.06);
  --shadow-2:0 2px 4px rgba(18,32,34,.05),0 10px 28px rgba(18,32,34,.08);
  --shadow-3:0 6px 14px rgba(18,32,34,.10),0 24px 60px rgba(18,32,34,.16);
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
  --tap:48px; --gutter:16px; --dock:72px;
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1213; --surface:#161c1d; --raised:#1b2223; --sunk:#212a2b;
    --line:#2c3638; --line-soft:#232c2d;
    --ink:#e5ebeb; --muted:#9aa8ab; --faint:#6b797c;
    --deep:#6ab5bc; --deep-soft:#143539; --deep-ink:#9dd4d9; --on-deep:#06191b;
    --signal:#ef8753; --signal-soft:#3a2016; --signal-ink:#ffc3a1; --signal-glow:rgba(239,135,83,.26); --on-signal:#1c0a02;
    --sage:#84b99a; --sage-soft:#1a2f26; --sage-ink:#b0dac1;
    --warn:#dfae6c; --warn-soft:#32281a;
    --danger:#eb8b79; --danger-soft:#39201b;
    --scrim:rgba(0,0,0,.6);
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    --shadow-3:0 6px 14px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1213; --surface:#161c1d; --raised:#1b2223; --sunk:#212a2b;
  --line:#2c3638; --line-soft:#232c2d;
  --ink:#e5ebeb; --muted:#9aa8ab; --faint:#6b797c;
  --deep:#6ab5bc; --deep-soft:#143539; --deep-ink:#9dd4d9; --on-deep:#06191b;
  --signal:#ef8753; --signal-soft:#3a2016; --signal-ink:#ffc3a1; --signal-glow:rgba(239,135,83,.26); --on-signal:#1c0a02;
  --sage:#84b99a; --sage-soft:#1a2f26; --sage-ink:#b0dac1;
  --warn:#dfae6c; --warn-soft:#32281a;
  --danger:#eb8b79; --danger-soft:#39201b;
  --scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  --shadow-3:0 6px 14px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
}

/* ── base ───────────────────────────────────────────── */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#app{max-width:600px;margin:0 auto;padding-inline:var(--gutter);padding-block:4px calc(var(--dock) + 40px + env(safe-area-inset-bottom,0px))}
body.no-dock #app{padding-block:4px 32px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,7vw,32px);font-weight:700}
h2{font-size:18.5px}
.h3{font-family:var(--body);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:13.5px;line-height:1.45}
.center{text-align:center;justify-content:center} .pad{padding-block:18px} .pad-top{padding-top:22px} .gap-top{margin-top:12px}
.lead{color:var(--muted);font-size:15.5px;line-height:1.5;max-width:60ch}
.pre{white-space:pre-wrap}
.calm-line{color:var(--sage-ink);font-size:15px}
.note-line{display:flex;align-items:center;gap:6px;margin-top:8px}
.warn-line{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:11px 14px;font-size:14.5px;margin-block:10px}
.stack{display:flex;flex-direction:column;gap:10px} .stack-lg{display:flex;flex-direction:column;gap:18px}
.grow{flex:1;min-width:0}
.ic{flex:none;display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* view enter: explains navigation, never decorates it */
#app.enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── headers ───────────────────────────────────────── */
.top{display:flex;align-items:flex-start;gap:10px;padding:18px 0 12px}
.sub-top{align-items:center;padding-top:10px}
.sub-top .icon-btn{margin-left:-10px}
.sub-top h1{font-size:clamp(22px,6vw,27px)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.greet{font-size:clamp(28px,8vw,36px)}
.icon-btn{width:var(--tap);height:var(--tap);flex:none;display:grid;place-items:center;border:none;background:none;border-radius:50%;color:var(--muted)}
.icon-btn:active{background:var(--sunk)}
.icon-btn.small{width:40px;height:40px}
.icon-btn.solid{background:var(--deep);color:var(--on-deep);border-radius:var(--r)}
.icon-btn.mic.live{background:var(--signal-soft);color:var(--signal);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--signal-glow)}}
.icon-btn[disabled]{opacity:.45}

/* ── the day band: wake → sleep ─────────────────────── */
.band{margin:4px 0 16px}
.band-track{position:relative;height:30px;border-radius:var(--r-sm);background:var(--sunk);overflow:hidden}
.band-block{position:absolute;top:0;bottom:0;background:var(--deep-soft);border-left:2px solid var(--deep);display:flex;align-items:center;overflow:hidden}
.band-block.k-work{background:repeating-linear-gradient(135deg,var(--deep-soft) 0 6px,transparent 6px 12px);border-left-color:var(--deep)}
.band-block span{font-size:10.5px;padding:0 5px;color:var(--deep-ink);white-space:nowrap;font-weight:500}
.band-past{position:absolute;top:0;bottom:0;left:0;background:var(--ink);opacity:.06;pointer-events:none}
.band-now{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:var(--signal);border-radius:2px;translate:-50% 0}
.band-now::before{content:"";position:absolute;top:0;left:50%;translate:-50% 0;width:8px;height:8px;border-radius:50%;background:var(--signal)}
.band-scale{display:flex;justify-content:space-between;margin-top:4px;font-size:10.5px;color:var(--faint)}

/* ── NOW: the one place the ember lives ─────────────── */
.now{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r-xl);padding:22px 20px 20px;margin:4px 0 14px;background:var(--signal-soft);color:var(--signal-ink);box-shadow:var(--shadow-2);animation:rise .28s ease-out}
.now .glow{position:absolute;z-index:-1;width:280px;height:280px;right:-110px;top:-130px;border-radius:50%;background:radial-gradient(circle,var(--signal-glow) 0%,transparent 68%)}
.now.t-focus .glow{animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.7}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.now-kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;opacity:.85}
.now-title{font-size:clamp(23px,6.4vw,28px);margin:8px 0 6px;color:inherit}
.now.big{padding:30px 22px 24px}
.now.big .now-title{font-size:clamp(28px,8vw,36px)}
.now-why{font-size:15.5px;line-height:1.45;opacity:.9;max-width:52ch}
.now-meta{font-size:13px;margin-top:6px;opacity:.8}
.now-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.now-also{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:14.5px}
.now-also span{flex:1}
.now.calm{background:var(--sage-soft);color:var(--sage-ink);box-shadow:var(--shadow-1)}
.now.calm .glow{background:radial-gradient(circle,color-mix(in srgb,var(--sage) 24%,transparent) 0%,transparent 68%)}
.now.t-night{background:var(--deep-soft);color:var(--deep-ink)}
.mode-banner{display:flex;align-items:center;gap:10px;background:var(--sage-soft);color:var(--sage-ink);border-radius:var(--r);padding:8px 10px 8px 14px;font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.mode-banner.m-chaos{background:var(--deep-soft);color:var(--deep-ink)}

/* ── buttons ───────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);font-weight:500;font-size:15.5px;transition:transform .08s ease,background .15s ease;text-decoration:none}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--on-deep);font-weight:600}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--on-signal);font-weight:600}
.btn.ghost{background:transparent}
.btn.ghost-on{background:transparent;border-color:color-mix(in srgb,currentColor 30%,transparent);color:inherit}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet-on{background:transparent;border-color:transparent;color:inherit;opacity:.8}
.btn.danger{color:var(--danger)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.wide{width:100%}
.btn.small{min-height:42px;padding:0 14px;font-size:14.5px}
.btn.tiny{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.big-btn{min-height:56px;font-size:17px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow.tight{gap:6px}
.danger-row{justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:10px}
.link{display:inline-flex;align-items:center;gap:2px;background:none;border:none;color:var(--deep);font-weight:500;font-size:14.5px;min-height:40px;padding:0 2px}

/* ── pulse ─────────────────────────────────────────── */
.pulse-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r-lg);padding:10px 10px 10px 16px;box-shadow:var(--shadow-1);margin-bottom:12px}
.pulse-q{font-weight:500;font-size:15px;flex:1 1 140px}
.pulse-dots{display:flex;gap:6px}
.pdot{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-size:14px}
.pdot:active{background:var(--deep-soft)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale-btn{min-height:58px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px}
.scale-btn.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.scale-n{font-size:15px;font-weight:500}
.scale-l{font-size:11px;line-height:1.1;text-align:center;opacity:.85}

/* ── suggestion and nudge ──────────────────────────── */
.suggest,.nudge{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-1);margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.nudge{border-left:3px solid var(--deep)}
.suggest p,.nudge p{font-size:15px}
.suggest.pattern{background:var(--deep-soft);color:var(--deep-ink);box-shadow:none}

/* ── sections and panels ───────────────────────────── */
.section{margin-top:22px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-height:40px}
.section-head h2{flex:1}
.count{font-size:13px;color:var(--faint)}
.panel{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.panel.soft{background:var(--sunk);box-shadow:none}
.panel.next-panel{box-shadow:var(--shadow-2);border-left:3px solid var(--deep)}

.row{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 12px;min-height:58px;border:none;border-top:1px solid var(--line-soft);background:none;width:100%;text-align:left}
.row:first-child{border-top:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;background:none;border:none;padding:8px 4px;text-align:left;min-height:48px}
.row .title{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.row .sub,.sub{color:var(--muted);font-size:13.5px;line-height:1.35}
.row.is-done .title{text-decoration:line-through;color:var(--faint)}
.row.is-skipped .title{color:var(--faint)}
.row.leaving{animation:leave .17s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(12px)}}
.row.due .sub{color:var(--warn)}
.row.fixed .at{color:var(--deep);font-weight:500;width:50px;flex:none;font-size:14px;padding-left:4px}
.row.empty-row{min-height:52px;padding-inline:16px}
.row.more-row{justify-content:center;color:var(--deep);font-weight:500;font-size:14.5px;min-height:48px}
.row.link-row{gap:12px;padding-inline:16px 12px;color:var(--ink)}
.row.link-row .ic{color:var(--muted)}
.row.stack-row{flex-wrap:wrap;padding-bottom:10px}
.row.stack-row .btnrow{width:100%;padding-left:4px}

/* the tick: 48px touch target, 26px visible circle */
.tick{width:var(--tap);height:var(--tap);flex:none;border:none;background:none;padding:0;display:grid;place-items:center;position:relative;margin-left:-6px}
.tick::before{content:"";width:26px;height:26px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;transition:background .15s ease,border-color .15s ease}
.tick:hover::before{border-color:var(--deep)}
.tick.done::before{background:var(--deep);border-color:var(--deep)}
.tick.done::after{content:"";position:absolute;width:10px;height:6px;border-left:2.5px solid var(--on-deep);border-bottom:2.5px solid var(--on-deep);transform:translateY(-1px) rotate(-45deg)}
.tick[disabled]{opacity:.4}

.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--muted);vertical-align:1px;margin-right:2px}
.tag.k-shopping{background:var(--sage-soft);color:var(--sage-ink)}
.tag.k-admin{background:var(--deep-soft);color:var(--deep-ink)}
.tag.k-reminder{background:var(--warn-soft);color:var(--warn)}

/* ── today triad ───────────────────────────────────── */
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tri{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 12px;border-radius:var(--r);border:none;background:var(--surface);box-shadow:var(--shadow-1);text-align:left;min-height:64px}
.tri-n{font-size:22px;font-weight:500;line-height:1}
.tri-l{font-size:12.5px;color:var(--muted);line-height:1.2}
.tri.t-must .tri-n{color:var(--deep)}
.tri.t-good .tri-n{color:var(--sage)}
.tri.t-later .tri-n{color:var(--faint)}
.coming{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}

/* ── quick actions ─────────────────────────────────── */
.quicks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:20px}
.quick{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:transparent;font-weight:500;font-size:14.5px;text-align:left}
.quick .ic{color:var(--deep)}
.quick:active{background:var(--surface)}
@media (min-width:520px){.quicks{grid-template-columns:repeat(4,1fr)}.quick{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:10px;min-height:76px}}

/* ── chips ─────────────────────────────────────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.center{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-size:14px;color:var(--muted)}
.chip.on{background:var(--deep-soft);border-color:transparent;color:var(--deep-ink);font-weight:600}
.chip.small{min-height:34px;padding:0 10px;font-size:12.5px;flex:none}
.chips.big .chip{min-height:46px;font-size:15px;padding:0 16px}
.chips.prompts{margin:14px 0}
.chip-x{border:none;background:none;display:grid;place-items:center;width:32px;height:32px;margin-right:-10px;color:inherit}

/* ── forms ─────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:13px;color:var(--muted);font-weight:500}
.input{width:100%;min-height:var(--tap);padding:11px 13px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);font-size:16px}
.input:focus{border-color:var(--deep);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--deep) 18%,transparent)}
.input.big{font-size:18px;min-height:54px}
.input.dump{min-height:170px;resize:vertical;line-height:1.5;border:none;background:transparent;padding:16px}
.input.dump:focus{box-shadow:none}
.input.bare{border:none;background:transparent;min-height:44px;padding:8px 4px}
.input.small-text{font-size:12.5px}
.input.date{max-width:220px}
textarea.input{resize:vertical;line-height:1.45}
select.input{appearance:auto}
.inline{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:6px 4px;border:none;background:none;text-align:left;font-size:15px;width:100%}
.knob{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s ease}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--raised);box-shadow:var(--shadow-1);transition:transform .15s ease}
.toggle.on .knob{background:var(--deep)}
.toggle.on .knob::after{transform:translateX(18px)}
.choice{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--raised);text-align:left;width:100%}
.choice .title{display:block;font-weight:600}
.choice .sub{display:block}
.choice.on{border-color:var(--deep);background:var(--deep-soft);color:var(--deep-ink)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daypick button{min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--raised);font-size:13px;color:var(--muted);padding:0}
.daypick button.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep);font-weight:600}
.subpanel{background:var(--sunk);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
