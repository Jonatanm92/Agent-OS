name: Apply Foundry Company OS patch

on:
  push:
    branches:
      - codex/foundry-company-os-v1
    paths:
      - .github/workflows/apply-foundry.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-foundry-company-os-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout locked development branch
        uses: actions/checkout@v4
        with:
          ref: codex/foundry-company-os-v1
          fetch-depth: 0

      - name: Reassemble and verify the source archive
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/foundry-parts.sha256 <<'EOF'
          b89cbd43f051b0a04cb07c57d4aae25458c672eff89cf12e799c5e23202ec379  .foundry/parts/00
          ce946832a4b905b673fec1c6f12326c3b1a3aea558f1b3690d1d147c0a02f67f  .foundry/parts/01
          0f5f9981c3da3cc27b1311b499d5616cfd55e75f8691773079a3870946e036aa  .foundry/parts/02
          676f97e6deb0fbbc46fe2ce457648f72f6fc3ac3f5b533510c505b30371ab611  .foundry/parts/03
          08f456b5557d96f3773622687ac4ce510634aa133244150a2be791b19974d76e  .foundry/parts/04
          1de4e80dd60d9fbdd1a4b907d19f63e1146280d30378ba6b82e2ceb71b0a65ba  .foundry/parts/05
          efefe96117edb5a34b0b53db34b4bd45a271c507c0e446be180d5b193e30b109  .foundry/parts/06
          f66053374601a86eeec2b9f5bbddd05bad430f4170bae736b566457909af6819  .foundry/parts/07
          32196600edd2ec0b077959059d8c062559ec9c85fb8cddb110776660ceb62cea  .foundry/parts/08
          ca6a7816d234e87a870c471861e10823bdd6e586cdbb9ebbac82c1b9fb0ec8c3  .foundry/parts/09
          01732879a8eee6d79456ec35e1f93db3db3787b434839318bed15a387e046821  .foundry/parts/10
          EOF
          sha256sum -c /tmp/foundry-parts.sha256
          cat .foundry/parts/* > /tmp/foundry-patch.tgz.b64
          base64 --decode /tmp/foundry-patch.tgz.b64 > /tmp/foundry-patch.tgz
          echo "4ce37072c117ea95c4185fba674cdbf3b08c7247c01dbc207a23cbad32728426  /tmp/foundry-patch.tgz" | sha256sum -c -
          tar -tzf /tmp/foundry-patch.tgz >/dev/null

      - name: Install the patch and remove legacy product defaults
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/foundry-patch.tgz -C .
          node scripts/migrations/2026-08-19-foundry-index.mjs
          rm -rf client/src/components/TuningTab.tsx
          rm -rf templates/erra-amp-sim
          rm -f CAREER_PORTFOLIO.md PROGRAM.md
          rm -rf .foundry/parts
          rm -f .github/workflows/apply-foundry.yml

      - name: Synchronize the exact dependency lock without running package scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Run unit tests and production builds
        shell: bash
        run: npm run verify

      - name: Verify migration idempotence and product invariants
        shell: bash
        run: ./scripts/verify-foundry.sh

      - name: Commit only after every verification gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: install Foundry Company OS v1"
          git push origin HEAD:codex/foundry-company-os-v1
