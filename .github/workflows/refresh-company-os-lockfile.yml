name: Rebuild Company OS lockfile once

on:
  push:
    branches: [codex/company-os-foundation]
    paths:
      - .github/workflows/refresh-company-os-lockfile.yml

permissions:
  contents: write

concurrency:
  group: rebuild-company-os-lockfile-once
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source branch
        uses: actions/checkout@v6
        with:
          ref: codex/company-os-foundation

      - name: Use pinned Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Use pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Rebuild a clean workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules client/node_modules server/node_modules
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --audit=false --fund=false
          npm ci --ignore-scripts --audit=false --fund=false
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"

      - name: Commit the lockfile and delete this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-company-os-lockfile.yml
          git commit -m "deps: rebuild lockfile with Node 24 and npm 12"
          git push origin HEAD:codex/company-os-foundation
