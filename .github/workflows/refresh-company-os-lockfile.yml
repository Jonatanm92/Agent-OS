name: Rebuild Company OS lockfile once

on:
  push:
    branches: [codex/company-os-foundation]
    paths:
      - .github/workflows/refresh-company-os-lockfile.yml

permissions:
  contents: write

concurrency:
  group: rebuild-company-os-lockfile-once
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: codex/company-os-foundation

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Rebuild a clean workspace lockfile
        shell: bash
        run: |
          rm -rf node_modules client/node_modules server/node_modules
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

      - name: Commit the clean lockfile and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-company-os-lockfile.yml
          git commit -m "deps: rebuild clean workspace lockfile"
          git push origin HEAD:codex/company-os-foundation
