name: Life OS · GitHub Pages

# Publishes life-os/public as a static site so the app can be installed on a
# phone. Requires Settings → Pages → Source: "GitHub Actions". Pushes skip the
# deploy (with a notice) until Pages is enabled; a manual run always deploys.

on:
  push:
    branches: [main]
    paths:
      - "life-os/public/**"
      - ".github/workflows/life-os-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: life-os-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled. Settings → Pages → Source: GitHub Actions, then run this workflow manually."
          fi

      - name: Check out repository
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Use Node.js 20
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test before publishing
        if: steps.pages.outputs.enabled == 'true'
        working-directory: life-os
        run: npm test

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the app
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: life-os/public

      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
