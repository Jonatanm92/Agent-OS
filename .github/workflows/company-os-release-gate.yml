name: Company OS release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-os-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-company-os:
    name: Verify operational company OS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run operational release contract
        run: node scripts/company-os-release-gate.mjs

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-os-release-evidence-${{ github.sha }}
          path: reports/release-gate/
          if-no-files-found: warn
          retention-days: 30
