name: Company OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/company-os-foundation]

permissions:
  contents: read

concurrency:
  group: company-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use pinned Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Use pinned npm
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "12.0.2"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject critical findings in all dependencies
        run: npm audit --audit-level=critical

      - name: Parse Windows runtime scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            'scripts/company-runtime.ps1',
            'scripts/set-owner-password.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              Write-Error "PowerShell parse errors in $file"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }

          if ($failed) { exit 1 }

      - name: Run deterministic tests
        run: npm test

      - name: Build client and server
        run: npm run build

      - name: Reject generated or uncommitted changes
        run: git diff --exit-code
