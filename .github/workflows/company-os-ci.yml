name: Company OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/company-os-foundation]

permissions:
  contents: read

concurrency:
  group: company-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Build client and server
        run: npm run build
