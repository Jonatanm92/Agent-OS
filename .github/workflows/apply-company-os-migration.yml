name: Apply Company OS migration

on:
  push:
    branches: [codex/company-os-foundation]
    paths:
      - scripts/apply-release-hardening.mjs
      - .github/workflows/apply-company-os-migration.yml

permissions:
  contents: write

concurrency:
  group: apply-company-os-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out Company OS branch
        uses: actions/checkout@v6
        with:
          ref: codex/company-os-foundation
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Apply deterministic migration
        run: node scripts/apply-release-hardening.mjs

      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration is already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/index.ts server/src/services/tool-registry.ts client/src/App.tsx client/src/api.ts client/src/components/ChatTab.tsx client/src/components/MissionControlTab.tsx client/src/components/Sidebar.tsx client/src/components/WorkspaceTab.tsx
          git commit -m "release: apply governed Company OS migration"
          git push origin HEAD:codex/company-os-foundation
