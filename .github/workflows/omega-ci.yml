name: OMEGA CI

on:
  push:
    branches: [main]
    paths: ['omega/**', '.github/workflows/omega-ci.yml']
  pull_request:
    paths: ['omega/**', '.github/workflows/omega-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

# CI never calls a paid model and uses no secrets: the Claude adapter is exercised
# against a fake CLI in tests, and the demo uses the offline template engine.
concurrency:
  group: omega-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: omega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/verify-evidence.ts docs/evidence/real-run-msn_990c384537ee
      - run: node src/cli.ts demo --home ./.omega-home
