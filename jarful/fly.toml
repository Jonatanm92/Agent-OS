# Fly.io alternative: `cd jarful && fly launch --no-deploy --copy-config`, then
# `fly volumes create jarful_data --size 1`, `fly secrets set ANTHROPIC_API_KEY=... ADMIN_TOKEN=...`, `fly deploy`.
app = "jarful"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  JARFUL_DB = "/data/db.json"
  TRUST_PROXY = "1"

[[mounts]]
  source = "jarful_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # single machine: the JSON store must not run on 2+ machines

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
