<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;background:#fdf6ec;font-family:ui-rounded,system-ui,sans-serif;color:#2b2118;display:flex;align-items:center;padding:0 80px;box-sizing:border-box;gap:60px}
.l{flex:1}.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px;margin-bottom:28px}
h1{font-size:64px;line-height:1.05;margin:0 0 24px;letter-spacing:-.02em}p{font-size:28px;color:#7a6a5a;margin:0}
.card{width:360px;background:#fff;border:1px solid #eadfce;border-radius:28px;padding:28px;box-shadow:0 20px 50px rgba(43,33,24,.12);font-size:24px}
.card h3{margin:0 0 14px;font-size:28px}.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eadfce}
.box{width:24px;height:24px;border:2px solid #1f6f4a;border-radius:6px}.box.on{background:#1f6f4a}.done{text-decoration:line-through;color:#7a6a5a}
.tag{display:inline-block;margin-top:18px;background:#e8743b;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:22px}
</style></head><body>
<div class="l"><div class="brand"><img src="../public/icon.svg" width="64" height="64">Jarful</div>
<h1>Every recipe you've saved, in one place.</h1><p>TikTok · Instagram · YouTube · any website · photos</p>
<span class="tag">No weekly subscriptions. Ever.</span></div>
<div class="card"><h3>This week's groceries</h3>
<div class="row"><span class="box on"></span><span class="done">4 bell peppers</span></div>
<div class="row"><span class="box on"></span><span class="done">⅜ cup olive oil</span></div>
<div class="row"><span class="box"></span>7 eggs</div>
<div class="row"><span class="box"></span>1 lb chicken thighs</div>
<div class="row" style="border:0"><span class="box"></span>2 oz cream cheese</div></div>
</body></html>
